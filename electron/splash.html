<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clue AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .splash-card {
      position: relative;
      width: 520px;
      height: 300px;
      margin: auto;
      border-radius: 24px;
      background: radial-gradient(circle at 20% 30%, #1e293b 0%, #0a0f1d 70%, #050811 100%);
      border: 1px solid rgba(56, 189, 248, 0.28);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85),
                  0 0 40px -10px rgba(56, 189, 248, 0.25),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      padding: 32px;
      overflow: hidden;
    }
    /* Subtle background glow effect */
    .glow-sphere {
      position: absolute;
      width: 260px;
      height: 260px;
      left: -40px;
      top: -40px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.2) 0%, rgba(99, 102, 241, 0.08) 50%, transparent 80%);
      filter: blur(20px);
      pointer-events: none;
    }
    .left-art {
      flex: 0 0 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .logo-container {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-pulse-ring {
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.4);
      animation: pulseRing 2.4s infinite ease-out;
    }
    .logo-orbit-ring {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 1px dashed rgba(129, 140, 248, 0.35);
      animation: rotateOrbit 12s infinite linear;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.85); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.2; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .logo-core {
      position: relative;
      width: 76px;
      height: 76px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #4f46e5 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.6),
                  inset 0 2px 4px rgba(255, 255, 255, 0.35);
    }
    .logo-core svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }
    .right-content {
      flex: 1;
      padding-left: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      color: #38bdf8;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 10px;
      width: fit-content;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: blink 1.2s infinite ease-in-out;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .app-title {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #bae6fd 70%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .app-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .app-version-line {
      font-family: 'SF Mono', Consolas, 'Courier New', monospace;
      font-size: 11px;
      color: #38bdf8;
      letter-spacing: 0.5px;
      margin-bottom: 22px;
    }
    .loading-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .loading-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      animation: loadSlide 1.8s infinite ease-in-out;
    }
    @keyframes loadSlide {
      0% { left: -45%; }
      50% { left: 40%; width: 55%; }
      100% { left: 100%; width: 30%; }
    }
    .status-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="glow-sphere"></div>
    <div class="left-art">
      <div class="logo-container">
        <div class="logo-pulse-ring"></div>
        <div class="logo-orbit-ring"></div>
        <div class="logo-core">
          <!-- Clue AI Atom/Quantum Icon -->
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" fill="#ffffff" />
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(30 12 12)" />
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(-30 12 12)" />
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(90 12 12)" />
          </svg>
        </div>
      </div>
    </div>
    <div class="right-content">
      <div class="badge">
        <span class="badge-dot"></span>
        <span>AI Engine Ready</span>
      </div>
      <div class="app-title">Clue AI</div>
      <div class="app-subtitle">AI Interview Intelligence Copilot</div>
      <div class="app-version-line">Version 5.9.6 &bull; Stealth Protection Active</div>
      <div class="loading-track">
        <div class="loading-bar"></div>
      </div>
      <div class="status-text">
        <span>Initializing engine...</span>
        <span>Starting</span>
      </div>
    </div>
  </div>
</body>
</html>
