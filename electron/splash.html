<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clue AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .splash-container {
      position: relative;
      width: 640px;
      height: 360px;
      margin: auto;
      border-radius: 24px;
      background: #030712;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 30px 80px -10px rgba(0, 0, 0, 0.95),
                  0 0 50px -10px rgba(56, 189, 248, 0.3),
                  inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      animation: splashFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes splashFadeIn {
      0% {
        opacity: 0;
        transform: scale(0.97);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    /* Full cinematic background image */
    .bg-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: url('splash_bg.jpg') center/cover no-repeat;
      pointer-events: none;
    }
    /* Dynamic atmospheric gradient overlays for perfect contrast and readability */
    .bg-overlay-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(3, 7, 18, 0.25) 0%,
        rgba(3, 7, 18, 0.65) 45%,
        rgba(3, 7, 18, 0.92) 80%,
        rgba(3, 7, 18, 0.97) 100%
      );
      pointer-events: none;
    }
    .bg-vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    /* Top header row with stealth indicator */
    .header-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 28px 0 28px;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(3, 7, 18, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 999px;
      color: #38bdf8;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulseDot 1.4s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .stealth-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(3, 7, 18, 0.5);
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Main brand area placed prominently on right side */
    .brand-content {
      position: relative;
      z-index: 10;
      align-self: flex-end;
      width: 340px;
      padding-right: 32px;
      display: flex;
      flex-direction: column;
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .logo-core {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #4f46e5 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px -2px rgba(2, 132, 199, 0.7),
                  inset 0 1px 2px rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .logo-core svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brand-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.8px;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8),
                   0 0 35px rgba(56, 189, 248, 0.4);
    }
    .brand-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: -0.2px;
      margin-top: 4px;
      margin-bottom: 6px;
    }
    .brand-version {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      letter-spacing: 0.4px;
    }

    /* Bottom loading footer */
    .footer-bar {
      position: relative;
      z-index: 10;
      padding: 0 28px 22px 28px;
    }
    .loading-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .loading-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.9);
      animation: loadSlide 1.5s infinite ease-in-out;
    }
    @keyframes loadSlide {
      0% { left: -45%; }
      50% { left: 40%; width: 55%; }
      100% { left: 100%; width: 30%; }
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
      font-family: 'SF Mono', Consolas, monospace;
    }
    .status-engine {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="bg-art"></div>
    <div class="bg-overlay-gradient"></div>
    <div class="bg-vignette"></div>

    <div class="header-bar">
      <div class="badge-pill">
        <span class="badge-dot"></span>
        <span>AI Engine Ready</span>
      </div>
      <div class="stealth-status">
        <span>Stealth Mode Protected</span>
      </div>
    </div>

    <div class="brand-content">
      <div class="logo-row">
        <div class="logo-core">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3" fill="#ffffff" />
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(30 12 12)" />
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(-30 12 12)" />
            <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(90 12 12)" />
          </svg>
        </div>
        <div class="brand-title">Clue AI</div>
      </div>
      <div class="brand-subtitle">AI Interview Intelligence Copilot</div>
      <div class="brand-version">Version 5.9.8 &bull; 11/09/2026</div>
    </div>

    <div class="footer-bar">
      <div class="loading-track">
        <div class="loading-bar"></div>
      </div>
      <div class="status-row">
        <span>Initializing engine and neural context...</span>
        <span class="status-engine">Ready</span>
      </div>
    </div>
  </div>
</body>
</html>
