name: Build & Release ClueAI (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target Release Tag'
        required: false
        default: 'v5.9.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build and Package Electron App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run build
          npx electron-builder --publish never

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $ver = $tag -replace '^v',''

          # Extract What's New from README.md if available
          $readme = Get-Content -Path "README.md" -Raw
          $match = [regex]::Match($readme, "(?s)### 🚀 What's New.*?(?=### 🪟|\Z)")
          $whatsNew = if ($match.Success) { $match.Value.Trim() } else { "Performance optimizations and stability enhancements." }

          $notes = @"
          # Clue AI $tag - Official Release

          Welcome to **Clue AI $tag**!

          $whatsNew

          ---

          ### 📦 Installation
          - **Windows**: Download ``ClueAI.exe`` from Assets below or update seamlessly within Clue AI.
          - **macOS**: Download ``ClueAI.dmg`` and drag to Applications.

          ---
          *Official Release &bull; Powered by Clue AI Engineering &bull; Developed by [Farhan Khalid](https://farhan-khalid-portfolio.vercel.app/)*
          "@
          Set-Content -Path "RELEASE_NOTES.md" -Value $notes -Encoding UTF8
        shell: powershell

      - name: Upload Release Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Clue AI ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Automated Release Email Broadcast
        if: matrix.os == 'windows-latest' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $ver = $tag -replace '^v',''
          Write-Host "Triggering automated Clue AI V$ver release announcement email broadcast..."
          $payload = @{
            type = "broadcast_update"
            action = "broadcast_update"
            version = $ver
            app_version = $ver
            highlights = "• Clean White High-Contrast Email Theme with superior text visibility and crisp layout`n• Automated Release Announcement Delivery on GitHub update release`n• Streamlined Update Center and instant session exports`n• Seamless performance and startup optimizations"
          } | ConvertTo-Json
          try {
            $resp = Invoke-RestMethod -Uri "https://script.google.com/macros/s/AKfycbyWqhztb7GbVlghFBJeusoJ-YcYx-9WPsADg9JbUXTOY-QKTpjR1ivKNyJP3iJ3wzpgKw/exec" -Method Post -Body $payload -ContentType "application/json" -TimeoutSec 30
            Write-Host "Broadcast webhook successfully invoked: $resp"
          } catch {
            Write-Host "Broadcast webhook notification notice: $_"
          }
        shell: powershell
