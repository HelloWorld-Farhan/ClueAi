name: Build & Release ClueAI (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target Release Tag'
        required: false
        default: 'v5.9.7'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
      ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Pre-cache Electron Binaries with Retries & Mirror Fallback
        shell: bash
        run: |
          ELECTRON_VER="v31.7.7"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            CACHE_DIR="$LOCALAPPDATA/electron/Cache"
            mkdir -p "$CACHE_DIR"
            TARGET_ZIP="$CACHE_DIR/electron-${ELECTRON_VER}-win32-x64.zip"
            if [ ! -f "$TARGET_ZIP" ]; then
              echo "Pre-fetching Windows Electron binary with retries..."
              curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "$TARGET_ZIP" "https://github.com/electron/electron/releases/download/${ELECTRON_VER}/electron-${ELECTRON_VER}-win32-x64.zip" || \
              curl -fL --retry 5 --retry-delay 3 -o "$TARGET_ZIP" "https://npmmirror.com/mirrors/electron/${ELECTRON_VER}/electron-${ELECTRON_VER}-win32-x64.zip" || true
            fi
            BUILDER_CACHE="$LOCALAPPDATA/electron-builder/Cache/electron"
            mkdir -p "$BUILDER_CACHE"
            cp "$TARGET_ZIP" "$BUILDER_CACHE/" 2>/dev/null || true

            # Pre-cache winCodeSign
            WCS_DIR="$LOCALAPPDATA/electron-builder/Cache/winCodeSign"
            mkdir -p "$WCS_DIR"
            WCS_ZIP="$WCS_DIR/winCodeSign-2.6.0.7z"
            if [ ! -f "$WCS_ZIP" ]; then
              echo "Pre-fetching winCodeSign..."
              curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "$WCS_ZIP" "https://npmmirror.com/mirrors/electron-builder-binaries/winCodeSign-2.6.0/winCodeSign-2.6.0.7z" || \
              curl -fL --retry 5 --retry-delay 3 -o "$WCS_ZIP" "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z" || true
            fi

            # Pre-cache nsis
            NSIS_DIR="$LOCALAPPDATA/electron-builder/Cache/nsis"
            mkdir -p "$NSIS_DIR"
            NSIS_ZIP="$NSIS_DIR/nsis-3.0.4.1.7z"
            if [ ! -f "$NSIS_ZIP" ]; then
              echo "Pre-fetching nsis..."
              curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "$NSIS_ZIP" "https://npmmirror.com/mirrors/electron-builder-binaries/nsis-3.0.4.1/nsis-3.0.4.1.7z" || \
              curl -fL --retry 5 --retry-delay 3 -o "$NSIS_ZIP" "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z" || true
            fi
          else
            CACHE_DIR="$HOME/Library/Caches/electron"
            mkdir -p "$CACHE_DIR"
            for ARCH in x64 arm64; do
              TARGET_ZIP="$CACHE_DIR/electron-${ELECTRON_VER}-darwin-${ARCH}.zip"
              if [ ! -f "$TARGET_ZIP" ]; then
                echo "Pre-fetching macOS Electron ${ARCH} binary with retries..."
                curl -fL --retry 5 --retry-delay 3 --retry-all-errors -o "$TARGET_ZIP" "https://github.com/electron/electron/releases/download/${ELECTRON_VER}/electron-${ELECTRON_VER}-darwin-${ARCH}.zip" || \
                curl -fL --retry 5 --retry-delay 3 -o "$TARGET_ZIP" "https://npmmirror.com/mirrors/electron/${ELECTRON_VER}/electron-${ELECTRON_VER}-darwin-${ARCH}.zip" || true
              fi
            done
          fi

      - name: Build and Package Electron App
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run build
          if ! npx electron-builder --publish never; then
            echo "Packaging failed, retrying with official Electron mirror..."
            sleep 5
            export ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/"
            npx electron-builder --publish never
          fi

      - name: Stage Evergreen Artifacts
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            if (fs.existsSync('release')) {
              const files = fs.readdirSync('release');
              const exe = files.find(f => f.startsWith('ClueAI-v') && f.endsWith('.exe'));
              if (exe) {
                fs.copyFileSync(path.join('release', exe), path.join('release', 'ClueAI.exe'));
                console.log('Staged evergreen ClueAI.exe from', exe);
              }
              const dmg = files.find(f => f.startsWith('ClueAI-v') && f.endsWith('.dmg'));
              if (dmg) {
                fs.copyFileSync(path.join('release', dmg), path.join('release', 'ClueAI.dmg'));
                console.log('Staged evergreen ClueAI.dmg from', dmg);
              }
            }
          "

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $ver = $tag -replace '^v',''

          # Extract What's New from README.md if available
          $readme = Get-Content -Path "README.md" -Raw
          $match = [regex]::Match($readme, "(?s)### 🚀 What's New.*?(?=### 🪟|\Z)")
          $whatsNew = if ($match.Success) { $match.Value.Trim() } else { "Performance optimizations and stability enhancements." }

          $notes = @"
          # Clue AI $tag - Official Release

          Welcome to **Clue AI $tag**!

          $whatsNew

          ---

          ### 📦 Installation
          - **Windows**: Download ``ClueAI-v$ver.exe`` (or ``ClueAI.exe``) from Assets below or update seamlessly within Clue AI.
          - **macOS**: Download ``ClueAI-v$ver.dmg`` (or ``ClueAI.dmg``) and drag to Applications.

          ---
          *Official Release &bull; Powered by Clue AI Engineering &bull; Developed by [Farhan Khalid](https://farhan-khalid-portfolio.vercel.app/)*
          "@
          Set-Content -Path "RELEASE_NOTES.md" -Value $notes -Encoding UTF8
        shell: powershell

      - name: Upload Release Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Clue AI ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Automated Release Email Broadcast
        if: matrix.os == 'windows-latest' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $ver = $tag -replace '^v',''
          Write-Host "Triggering automated Clue AI V$ver release announcement email broadcast..."
          $payloadObj = @{
            type = "broadcast_update"
            action = "broadcast_update"
            version = $ver
            app_version = $ver
            highlights = "Instant cosmic branded splash window with zero empty-box latency, 100% headless silent in-app update installer with zero terminal flashes, and multi-inbox registration & broadcast delivery."
            extra_emails = @("farhankhalid17968@gmail.com", "clueai.support@gmail.com")
          }
          $payload = $payloadObj | ConvertTo-Json
          try {
            $bodyBytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
            $resp = Invoke-RestMethod -Uri "https://script.google.com/macros/s/AKfycbyWqhztb7GbVlghFBJeusoJ-YcYx-9WPsADg9JbUXTOY-QKTpjR1ivKNyJP3iJ3wzpgKw/exec" -Method Post -Body $bodyBytes -ContentType "application/json; charset=utf-8" -TimeoutSec 30
            Write-Host "Broadcast webhook successfully invoked: $($resp | ConvertTo-Json -Compress)"
            if ($resp.message) {
              Write-Host "Broadcast Result: $($resp.message)"
            }
            if ($resp.recipients) {
              Write-Host "Recipient Email IDs: $($resp.recipients -join ', ')"
            }
          } catch {
            Write-Host "Broadcast webhook notification notice: $_"
          }
        shell: powershell
